apiVersion: apps/v1
kind: Deployment
metadata: {name: aceest-canary, namespace: aceest}
spec:
  replicas: 1
  selector: {matchLabels: {app: aceest-fitness, track: canary}}
  template:
    metadata: {labels: {app: aceest-fitness, track: canary}}
    spec:
      containers:
        - name: aceest-fitness
          image: DOCKERHUB_USERNAME/aceest-fitness:canary
          ports: [{name: http, containerPort: 5000}]
          readinessProbe: {httpGet: {path: /ready, port: http}}
