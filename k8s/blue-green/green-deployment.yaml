apiVersion: apps/v1
kind: Deployment
metadata: {name: aceest-green, namespace: aceest}
spec:
  replicas: 3
  selector: {matchLabels: {app: aceest-fitness, track: green}}
  template:
    metadata: {labels: {app: aceest-fitness, track: green}}
    spec:
      containers:
        - name: aceest-fitness
          image: DOCKERHUB_USERNAME/aceest-fitness:green
          ports: [{name: http, containerPort: 5000}]
          readinessProbe: {httpGet: {path: /ready, port: http}}
          livenessProbe: {httpGet: {path: /health, port: http}}
