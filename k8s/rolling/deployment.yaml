apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness
  namespace: aceest
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: aceest-fitness, track: stable}
  template:
    metadata:
      labels: {app: aceest-fitness, track: stable}
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: aceest-fitness
          image: DOCKERHUB_USERNAME/aceest-fitness:latest
          ports: [{name: http, containerPort: 5000}]
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, runAsNonRoot: true, runAsUser: 10001, readOnlyRootFilesystem: true}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: instance, mountPath: /app/instance}]
      volumes: [{name: tmp, emptyDir: {}}, {name: instance, emptyDir: {}}]
